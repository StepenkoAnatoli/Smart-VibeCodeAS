name: Report a mistake
description: A wrong fact, outdated advice, a broken link, or an explanation that confused you.
title: "Mistake: "
labels: ["mistake"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: The chapter and heading, or a link to the section.
      placeholder: "Chapter 03, Secrets Management"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or confusing?
      description: Quote the text if you can. "I didn't understand this" is a perfectly good report.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it say instead? (optional)
  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: A link to official docs or another reliable source, if you have one.
