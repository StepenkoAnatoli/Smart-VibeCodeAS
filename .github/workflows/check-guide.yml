name: Check guide

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC: catch outside links that stopped working.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Links inside the repo and reel term coverage
        run: python3 scripts/check_guide.py

      - name: Outside links (weekly and manual runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_guide.py --external
